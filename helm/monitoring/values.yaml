---
grafana:
  admin:
    existingSecret: grafana-credentials
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 15d
alertmanager:
  alertmanagerSpec:
    retention: 120h
