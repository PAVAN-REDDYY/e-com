{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "catalog-service.fullname" . }}
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.databaseUrl is required when secret.existingSecret is empty" .Values.secret.databaseUrl | quote }}
{{- end }}
